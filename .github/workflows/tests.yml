name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matches the Python range required by LLaMA-Factory 0.9.4.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # macOS and Windows: the interactive menu's key handling and paths
        # differ per platform (termios vs msvcrt), so run the suite there too.
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The ingestion pipeline is pure stdlib, so the tests need no dependencies
      # (no llamafactory/torch install — those are only needed for training).
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
